<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3a6ea5">
<title>MyCareLog — 今日のケア</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1d2733; --sub:#6b7785;
    --line:#e3e8ee; --accent:#3a6ea5; --accent-soft:#e8f0f8;
    --warn-bg:#fff4e5; --warn-line:#f0c089; --warn-ink:#8a5200;
    --danger-bg:#fdecec; --danger-line:#f0a3a3; --danger-ink:#a32020;
    --done:#2e9e6b; --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    background:var(--bg); color:var(--ink);
    line-height:1.6; font-size:16px;
    padding:0 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px; margin:0 auto; padding:16px 14px 40px;}
  header{padding:8px 2px 14px;}
  header h1{font-size:1.15rem; margin:0; letter-spacing:.02em;}
  header .date{color:var(--sub); font-size:.82rem; margin-top:2px;}

  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px; margin-bottom:14px;
    box-shadow:0 1px 2px rgba(20,40,70,.04);
  }
  .label{font-size:.78rem; color:var(--sub); font-weight:600; letter-spacing:.04em; margin-bottom:8px;}

  /* お知らせ・編集バナー */
  .banner{
    border-radius:12px; padding:11px 13px; margin-bottom:14px; font-size:.88rem;
    background:var(--accent-soft); border:1px solid #bcd4ea; color:#27537e;
  }
  .banner.edit{background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn-ink);}
  .banner .row{display:flex; gap:8px; margin-top:9px;}
  .bbtn{
    flex:1; border:1px solid var(--accent); background:#fff; color:var(--accent);
    border-radius:9px; padding:9px 6px; font-size:.84rem; font-weight:600; cursor:pointer;
  }
  .bbtn.primary{background:var(--accent); color:#fff;}
  .bbtn.ghost{border-color:var(--warn-line); color:var(--warn-ink);}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .chip{
    border:1px solid var(--accent); background:#fff; color:var(--accent);
    border-radius:14px; padding:4px 12px; font-size:.8rem; font-weight:600; cursor:pointer;
  }

  /* シフト選択 */
  .shifts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .shift-btn{
    border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:10px; padding:10px 4px; font-size:.86rem; font-weight:600;
    cursor:pointer; transition:.12s; text-align:center; line-height:1.25;
  }
  .shift-btn small{display:block; font-weight:400; font-size:.68rem; color:var(--sub); margin-top:2px;}
  .shift-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .shift-btn.active small{color:rgba(255,255,255,.85);}

  /* 警告 */
  .warns{margin-bottom:14px;}
  .warn{
    border-radius:12px; padding:11px 13px; margin-bottom:8px;
    font-size:.88rem; display:flex; gap:9px; align-items:flex-start;
    border:1px solid;
  }
  .warn .ic{flex:0 0 auto; font-size:1.05rem; line-height:1.4;}
  .warn.alert{background:var(--danger-bg); border-color:var(--danger-line); color:var(--danger-ink);}
  .warn.note{background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn-ink);}
  .warn b{font-weight:700;}

  /* ノーケア */
  .nocare-link{
    display:block; width:100%; text-align:center; background:none;
    border:1px dashed #cdd6df; color:var(--sub); border-radius:10px;
    padding:9px; font-size:.82rem; cursor:pointer; margin:0 0 14px;
  }
  .nocare-card{
    background:#eef0f3; border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 14px; text-align:center; color:var(--sub); font-size:.9rem; margin-bottom:14px;
  }
  .nocare-card .big{font-size:1.6rem; display:block; margin-bottom:6px;}
  .nocare-card button{
    margin-top:10px; background:none; border:1px solid #cdd6df; color:var(--sub);
    border-radius:9px; padding:7px 14px; font-size:.8rem; cursor:pointer;
  }

  /* ルーティン */
  .block-title{
    font-size:.95rem; font-weight:700; margin:18px 2px 8px; display:flex;
    align-items:center; gap:7px;
  }
  .block-title .em{font-size:1.1rem;}
  .auto-hint{
    font-size:.76rem; color:var(--sub); background:#eef2f6;
    border-radius:9px; padding:7px 10px; margin:0 0 10px;
  }
  .steps{list-style:none; margin:0; padding:0;}
  .step{
    display:flex; align-items:flex-start; gap:11px;
    padding:11px 12px; border:1px solid var(--line); border-radius:12px;
    background:#fff; margin-bottom:8px; cursor:pointer; transition:.12s;
  }
  .step.multi{cursor:default;}
  .step.checked{background:#f1faf5; border-color:#bfe6d2;}
  .box{
    flex:0 0 auto; width:22px; height:22px; border-radius:7px;
    border:2px solid #cdd6df; margin-top:1px; display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:.8rem; transition:.12s;
  }
  .step.checked .box{background:var(--done); border-color:var(--done);}
  .step-body{flex:1; min-width:0;}
  .step-name{font-size:.95rem; font-weight:600;}
  .step.checked .step-name{color:var(--sub); text-decoration:line-through;}
  .step-note{font-size:.76rem; color:var(--sub); margin-top:1px;}
  .step .cat{
    display:inline-block; font-size:.66rem; color:var(--accent);
    background:var(--accent-soft); border-radius:5px; padding:1px 6px; margin-top:4px;
  }
  /* 同カテゴリ複数商品の選択チップ */
  .item-chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px;}
  .ichip{
    border:1.5px solid #cdd6df; background:#fff; color:var(--ink);
    border-radius:16px; padding:6px 13px; font-size:.82rem; font-weight:600; cursor:pointer;
    transition:.12s;
  }
  .ichip.on{background:var(--done); border-color:var(--done); color:#fff;}
  .choice-hint{
    font-size:.78rem; color:var(--warn-ink); background:var(--warn-bg);
    border:1px dashed var(--warn-line); border-radius:9px; padding:7px 10px; margin:0 0 8px;
  }
  .empty{color:var(--sub); font-size:.88rem; padding:6px 2px;}

  /* 保存ボタン */
  .save{
    position:sticky; bottom:10px; margin-top:18px;
    background:var(--accent); color:#fff; border:none; width:100%;
    padding:15px; border-radius:13px; font-size:1rem; font-weight:700;
    cursor:pointer; box-shadow:0 4px 14px rgba(58,110,165,.32);
  }
  .save:active{transform:translateY(1px);}
  .save.dirty{
    background:#d97b29;
    box-shadow:0 4px 14px rgba(217,123,41,.4);
  }
  .save.saved{
    background:#8fa6ba;
    box-shadow:0 2px 8px rgba(20,40,70,.15);
  }

  /* トースト */
  #toast{
    position:fixed; bottom:84px; left:50%; transform:translateX(-50%);
    background:rgba(29,39,51,.88); color:#fff; padding:8px 16px;
    border-radius:20px; font-size:.82rem; opacity:0; transition:.25s;
    pointer-events:none; z-index:9; white-space:nowrap;
  }
  #toast.show{opacity:1;}

  /* 折りたたみセクション共通 */
  .hist-toggle{
    background:none; border:none; color:var(--accent); font-size:.86rem;
    font-weight:600; cursor:pointer; padding:6px 2px; display:flex; align-items:center; gap:5px;
  }
  .hist-list{margin-top:6px;}
  .hist-item{
    border-top:1px solid var(--line); padding:10px 2px; font-size:.84rem;
  }
  .hist-item:first-child{border-top:none;}
  .hist-head{display:flex; justify-content:space-between; color:var(--sub); margin-bottom:3px;}
  .hist-head .sh{color:var(--accent); font-weight:600;}
  .hist-items{color:var(--ink); line-height:1.7;}
  .hist-del{color:var(--danger-ink); background:none; border:none; font-size:.78rem; cursor:pointer;}

  /* ボトル管理 */
  .bottle-row{border-top:1px solid var(--line); padding:10px 2px;}
  .bottle-row:first-child{border-top:none;}
  .bottle-head{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .bottle-name{font-size:.88rem; font-weight:600;}
  .bottle-sub{font-size:.74rem; color:var(--sub); margin-top:2px;}
  .bottle-btn{
    flex:0 0 auto; border:1px solid var(--accent); background:#fff; color:var(--accent);
    border-radius:8px; padding:5px 10px; font-size:.76rem; font-weight:600; cursor:pointer;
  }
  .bottle-btn.finish{border-color:var(--warn-line); color:var(--warn-ink);}
  .bottle-bar{height:7px; background:#e8edf2; border-radius:4px; margin-top:7px; overflow:hidden;}
  .bottle-bar div{height:100%; background:var(--done); border-radius:4px;}
  .bottle-bar div.low{background:#e09a3c;}
  .bottle-bar div.empty{background:var(--danger-ink);}

  /* マイアイテム */
  .item-row{border-top:1px solid var(--line); padding:10px 2px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .item-row:first-child{border-top:none;}
  .item-row .nm{font-size:.88rem; font-weight:600;}
  .item-row .meta{font-size:.74rem; color:var(--sub);}
  .item-row.archived .nm{color:var(--sub); text-decoration:line-through; font-weight:400;}
  .item-acts{flex:0 0 auto; display:flex; gap:6px;}
  .item-acts button{
    border:1px solid var(--line); background:#fff; color:var(--sub);
    border-radius:8px; padding:4px 9px; font-size:.74rem; cursor:pointer;
  }
  .item-acts button.edit{border-color:var(--accent); color:var(--accent);}
  .add-item-btn{
    display:block; width:100%; text-align:center; border:1px dashed var(--accent);
    background:var(--accent-soft); color:var(--accent); border-radius:10px;
    padding:9px; font-size:.84rem; font-weight:600; cursor:pointer; margin:8px 0;
  }
  .item-form{background:#f4f7fa; border:1px solid var(--line); border-radius:10px; padding:11px; margin:8px 0;}
  .item-form label{display:block; font-size:.74rem; color:var(--sub); font-weight:600; margin:7px 0 2px;}
  .item-form input, .item-form select{
    width:100%; padding:9px 10px; border:1px solid #cdd6df; border-radius:8px;
    font-size:.92rem; background:#fff; color:var(--ink);
  }
  .item-form .row{display:flex; gap:8px; margin-top:11px;}

  /* データ管理 */
  .data-note{font-size:.78rem; color:var(--sub); margin:4px 0 10px;}
  .data-row{display:flex; gap:8px;}

  footer{text-align:center; color:var(--sub); font-size:.72rem; margin-top:24px; line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✨ MyCareLog</h1>
    <div class="date" id="today"></div>
  </header>

  <div id="banner"></div>

  <!-- ① シフト -->
  <div class="card">
    <div class="label" id="shiftLabel">① 今日のシフト</div>
    <div class="shifts" id="shifts"></div>
  </div>

  <!-- 警告 -->
  <div class="warns" id="warns"></div>

  <!-- ノーケア -->
  <div id="nocareArea"></div>

  <!-- ② ルーティン -->
  <div id="routine"></div>

  <!-- 保存 -->
  <button class="save" id="saveBtn">記録を保存</button>

  <!-- ③ マイアイテム -->
  <div class="card" style="margin-top:18px;">
    <button class="hist-toggle" id="itemsToggle">▸ マイアイテム（登録・編集）</button>
    <div class="hist-list" id="itemsPanel" style="display:none;"></div>
  </div>

  <!-- ④ ボトル管理 -->
  <div class="card">
    <button class="hist-toggle" id="bottleToggle">▸ ボトル管理（買い足しタイマー）</button>
    <div class="hist-list" id="bottleList" style="display:none;"></div>
  </div>

  <!-- ⑤ 履歴 -->
  <div class="card">
    <button class="hist-toggle" id="histToggle">▸ 記録履歴を見る</button>
    <div class="hist-list" id="histList" style="display:none;"></div>
  </div>

  <!-- ⑥ データ管理 -->
  <div class="card">
    <button class="hist-toggle" id="dataToggle">▸ データ管理（バックアップ）</button>
    <div class="hist-list" id="dataPanel" style="display:none;">
      <p class="data-note">記録・アイテム・ボトル情報をファイルに保存できます。機種変更や、もしもの時の備えに。月1回くらいの書き出しがおすすめ。</p>
      <div class="data-row">
        <button class="bbtn primary" id="exportBtn">📤 バックアップを書き出す</button>
        <button class="bbtn" id="importBtn">📥 読み込む</button>
      </div>
    </div>
  </div>

  <footer>
    やったものをタップ → 最後に「記録を保存」。<br>
    記録は端末内（localStorage）にのみ保存されます。<br>
    叩き台 v0.7 — マイアイテム登録・同カテゴリの商品選択・バックアップ。
  </footer>
</div>
<div id="toast">✓ 保存しました</div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">

<script>
"use strict";

/* ===========================================================
   機能カテゴリ（spec.md §2）— ルーティンを左右する役割の有限集合
   =========================================================== */
const CAT = {
  cleanseOil:'クレンジングオイル', washNormal:'洗顔(通常)', washClay:'洗顔(クレイ)',
  toner:'化粧水', serumGuard:'守りの美容液', retinol:'レチノール類',
  cream:'クリーム', allinone:'オールインワン', uv:'日焼け止め',
  device:'美顔器', pao:'表情筋トレ'
};
/* 中身が減らないカテゴリ（ボトル管理の対象外） */
const NON_CONSUMABLE_CATS = [CAT.device, CAT.pao];

/* 初期アイテム（田畑さんの実データ・spec.md §3。IDは過去の記録と互換） */
const DEFAULT_ITEMS = [
  {id:'pao',        name:'PAO（表情筋トレ）',        cat:CAT.pao,        note:'歯磨き後・素肌・週5日'},
  {id:'toner',      name:'トリートメントソフナー',     cat:CAT.toner,      note:'全ケアの土台'},
  {id:'ocher',      name:'OCHER ザ セラム',          cat:CAT.allinone,   note:'時短オールインワン（UV機能なし）'},
  {id:'uvMain',     name:'Bioré UV アスリズム',       cat:CAT.uv,         note:'メインUV・SPF50+'},
  {id:'uvStick',    name:'Clear Stick UV（携帯用）',   cat:CAT.uv,         note:'外出先の塗り直し用'},
  {id:'cleanseOil', name:'マイルドクレンジングオイル',  cat:CAT.cleanseOil, note:'乾いた肌・乳化して流す'},
  {id:'washBiore',  name:'メンズビオレ ザフェイス',     cat:CAT.washNormal, note:'通常洗顔'},
  {id:'washFancl',  name:'FANCL 泥ジェル洗顔',        cat:CAT.washClay,   note:'軽く濡らした肌・週3-4回'},
  {id:'serum',      name:'アルティミューン セラム',     cat:CAT.serumGuard, note:'守り・毎晩必須'},
  {id:'retinol',    name:'ANUA レチノール0.3',        cat:CAT.retinol,    note:'攻め・週2〜3回・翌朝UV必須'},
  {id:'cream',      name:'スキンエンパワリングクリーム', cat:CAT.cream,      note:'毎晩・美顔器併用OK'},
  {id:'device',     name:'STELLA BEAUTE 美顔器',      cat:CAT.device,     note:'数日に1回・レチノールと同夜NG'},
];

const SHIFTS = [
  {id:'early',  label:'早番',     sub:''},
  {id:'late',   label:'遅番',     sub:''},
  {id:'night',  label:'夜勤',     sub:'今夜出勤'},
  {id:'after',  label:'夜勤明け',  sub:'休日'},
  {id:'off',    label:'休み',     sub:'朝＋夜'},
];

/* ===========================================================
   ルーティン定義 — カテゴリ駆動（spec.md §4）
   各ステップは「カテゴリ」で書く。実際の商品は登録アイテムから引く。
   =========================================================== */
const stepMorningWork = () => [
  {cats:[CAT.pao]},
  {cats:[CAT.toner]},
  {cats:[CAT.allinone]},
  {cats:[CAT.uv], note:'外出時・レチノール翌朝は必須'},
];
const stepShukkin = () => [
  {cats:[CAT.pao]},
  {cats:[CAT.toner]},
  {cats:[CAT.allinone]},
];
const stepNightFull = () => [
  {cats:[CAT.cleanseOil]},
  {cats:[CAT.washNormal, CAT.washClay], label:'洗顔', note:'通常と泥ジェルは交互（泥ジェルは週3-4回）'},
  {cats:[CAT.toner]},
  {cats:[CAT.serumGuard]},
  {cats:[CAT.retinol], choice:'attack'},
  {cats:[CAT.cream]},
  {cats:[CAT.device], choice:'attack'},
];
const stepNightGuard = () => [
  {cats:[CAT.cleanseOil], note:'肌の状態次第で'},
  {cats:[CAT.washNormal, CAT.washClay], label:'洗顔', note:'通常洗顔のみ（泥ジェルのパック/マッサージNG）'},
  {cats:[CAT.toner]},
  {cats:[CAT.serumGuard]},
  {cats:[CAT.cream]},
];
const stepMinimal = () => [
  {cats:[CAT.pao], note:'余裕があれば'},
  {cats:[CAT.toner]},
  {cats:[CAT.allinone]},
  {cats:[CAT.uv], note:'外出するなら'},
];
const stepWake = () => [
  {cats:[CAT.toner], note:'任意・スキップOK'},
  {cats:[CAT.allinone]},
  {cats:[CAT.uv], note:'外出するなら'},
];

const SLOT_META = {
  m:       {icon:'🌅', label:'朝 / 出勤前'},
  n:       {icon:'🌙', label:'夜 / 就寝前'},
  kitaku:  {icon:'🌅', label:'帰宅後・就寝前（朝）'},
  kishou:  {icon:'☀️', label:'起床後（昼）'},
  shukkin: {icon:'🌆', label:'出勤前（夕方〜夜）'},
};

function slotsFor(shift, prevNight){
  switch(shift){
    case 'early':
    case 'late':
      return [
        {key:'m', steps:stepMorningWork()},
        {key:'n', steps:stepNightFull()},
      ];
    case 'night': {
      const s=[];
      if(prevNight) s.push({key:'kitaku', steps:stepNightGuard(),
        hint:'前日も夜勤の記録があるので、帰宅後（朝）の枠を表示しています。'});
      s.push({key:'shukkin', steps:stepShukkin()});
      if(!prevNight) s[s.length-1].hint='連続夜勤の中日は、前日を夜勤として記録すると「帰宅後（朝）」の枠も表示されます。';
      return s;
    }
    case 'after':
      return [
        {key:'kitaku', steps:stepNightGuard()},
        {key:'kishou', steps:stepWake()},
        {key:'n', steps:stepNightFull(),
          hint:'翌日は日勤帯に戻れるので、夜はフルケアOK（攻めも選べます）。'},
      ];
    case 'off':
      return [
        {key:'m', label:'朝（最小限）', steps:stepMinimal()},
        {key:'n', steps:stepNightFull(),
          hint:'帰省などで夜は何もしない日は、空のまま保存すればOK（「—（ケアなし）」として残ります）。'},
      ];
    default: return [];
  }
}

/* ===========================================================
   保存キー
   =========================================================== */
const LS_V1 = 'mcl_log_v1';
const LS_V2 = 'mcl_log_v2';
const LS_LOG = 'mcl_log_v3';
const LS_SHIFT = 'mcl_shift_today';
const LS_BOTTLES = 'mcl_bottles_v1';
const LS_ITEMS = 'mcl_items_v1';

function pad(n){ return String(n).padStart(2,'0'); }
function dateKeyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
const todayKey = dateKeyOf(new Date());
const yesterdayKey = (()=>{ const d=new Date(); d.setDate(d.getDate()-1); return dateKeyOf(d); })();
function dayBefore(key){
  const d=new Date(key+'T00:00:00'); d.setDate(d.getDate()-1); return dateKeyOf(d);
}

function loadLog(){ try{return JSON.parse(localStorage.getItem(LS_LOG))||[];}catch(e){return [];} }
function saveLog(log){ localStorage.setItem(LS_LOG, JSON.stringify(log)); }
function getRec(date){ return loadLog().find(r=>r.date===date)||null; }
function upsertRec(rec){
  const log=loadLog();
  const i=log.findIndex(r=>r.date===rec.date);
  if(i>=0) log[i]=rec; else log.push(rec);
  saveLog(log);
}

/* ===========================================================
   マイアイテム（登録商品）
   =========================================================== */
(function ensureItems(){
  try{
    const a=JSON.parse(localStorage.getItem(LS_ITEMS));
    if(Array.isArray(a)&&a.length) return;
  }catch(e){}
  localStorage.setItem(LS_ITEMS, JSON.stringify(DEFAULT_ITEMS));
})();
function allItems(){ try{return JSON.parse(localStorage.getItem(LS_ITEMS))||[];}catch(e){return [];} }
function saveItems(arr){ localStorage.setItem(LS_ITEMS, JSON.stringify(arr)); }
function activeItems(){ return allItems().filter(i=>!i.archived); }
function itemById(id){ return allItems().find(i=>i.id===id)||null; }
function itemCat(id){ const it=itemById(id); return it?it.cat:null; }
function shortName(id){
  const it=itemById(id);
  return it ? it.name.replace(/（.*?）/g,'') : '(不明なアイテム)';
}
function newItemId(){ return 'u'+Date.now().toString(36)+Math.floor(Math.random()*100); }

/* ===========================================================
   旧形式からの引き継ぎ
   =========================================================== */
(function migrate(){
  if(localStorage.getItem(LS_LOG)) return;
  let v2=null;
  try{ v2=JSON.parse(localStorage.getItem(LS_V2)); }catch(e){}
  if(!v2){
    let v1=null;
    try{ v1=JSON.parse(localStorage.getItem(LS_V1)); }catch(e){}
    if(!v1||!Array.isArray(v1)) return;
    const morningIds=['pao','toner','ocher','uvMain','uvStick'];
    v2=v1.map(r=>{
      const morning=[], night=[];
      (r.items||[]).forEach(id=>{ (morningIds.includes(id)?morning:night).push(id); });
      return {date:r.date, shift:r.shift, morning, night, noCare:false};
    });
  }
  if(!Array.isArray(v2)) return;
  const v3=v2.map(r=>{
    const slots={};
    if((r.morning||[]).length) slots.m=r.morning;
    if((r.night||[]).length) slots.n=r.night;
    return {date:r.date, shift:r.shift, noCare:!!r.noCare, slots};
  });
  saveLog(v3);
})();
(function migrateOff(){
  const log=loadLog(); let changed=false;
  log.forEach(r=>{ if(r.shift==='off1'||r.shift==='off2'){ r.shift='off'; changed=true; } });
  if(changed) saveLog(log);
  const s=localStorage.getItem(LS_SHIFT);
  if(s==='off1'||s==='off2') localStorage.setItem(LS_SHIFT,'off');
})();

/* ===========================================================
   状態（editDate：今日 or 過去日）／保存は「記録を保存」ボタンで
   =========================================================== */
let state = { editDate: todayKey, shift: null, noCare: false, checked: new Set(), dirty: false };

function loadStateFor(date){
  state.editDate = date;
  const rec = getRec(date);
  if(rec){
    state.shift = rec.shift;
    state.noCare = !!rec.noCare;
    const uids=[];
    Object.entries(rec.slots||{}).forEach(([k,ids])=>ids.forEach(id=>uids.push(k+':'+id)));
    state.checked = new Set(uids);
  }else{
    state.shift = (date===todayKey) ? (localStorage.getItem(LS_SHIFT)||null) : null;
    state.noCare = false;
    state.checked = new Set();
  }
  state.dirty = false;
}

function dayWordOf(date){
  if(date===todayKey) return '今日';
  if(date===yesterdayKey) return '昨日';
  return fmtMD(date);
}
function dayLabelOf(date){
  if(date===todayKey) return '今日';
  if(date===yesterdayKey) return `昨日（${fmtMD(date)}）`;
  return fmtMD(date);
}

function doSave(){
  if(!state.shift && !state.noCare){ alert('先にシフトを選んでください。'); return; }
  const slots={};
  state.checked.forEach(uid=>{
    const i=uid.indexOf(':');
    const k=uid.slice(0,i), id=uid.slice(i+1);
    (slots[k]=slots[k]||[]).push(id);
  });
  upsertRec({
    date: state.editDate,
    shift: state.shift,
    noCare: state.noCare,
    slots: state.noCare ? {} : slots,
  });
  state.dirty=false;
  flashToast();
  updateSaveBtn();
  renderBanner();
  renderWarnings();
  renderHistoryIfOpen();
  renderBottlesIfOpen();
}

function markDirty(){
  state.dirty=true;
  updateSaveBtn();
}

function updateSaveBtn(){
  const b=document.getElementById('saveBtn');
  b.style.display=(state.noCare||state.shift)?'block':'none';
  b.classList.remove('dirty','saved');
  if(state.dirty){
    b.classList.add('dirty');
    b.textContent='記録を保存（未保存の変更あり）';
  }else if(getRec(state.editDate)){
    b.classList.add('saved');
    b.textContent='✓ 保存済み';
  }else{
    b.textContent='記録を保存';
  }
}

let toastTimer=null;
function flashToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg||'✓ 保存しました';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1400);
}

/* ===========================================================
   ボトル管理（買い足しタイマー）
   =========================================================== */
function loadBottles(){ try{return JSON.parse(localStorage.getItem(LS_BOTTLES))||{};}catch(e){return {};} }
function saveBottles(b){ localStorage.setItem(LS_BOTTLES, JSON.stringify(b)); }
function consumableItems(){ return activeItems().filter(i=>!NON_CONSUMABLE_CATS.includes(i.cat)); }

function usesBetween(itemId, startKey, endKey){
  let c=0;
  loadLog().forEach(r=>{
    if(r.noCare) return;
    if(r.date<startKey) return;
    if(endKey && r.date>endKey) return;
    Object.values(r.slots||{}).forEach(ids=>{ if(ids.includes(itemId)) c++; });
  });
  return c;
}

function bottleInfo(itemId){
  const cycles=loadBottles()[itemId]||[];
  const current=cycles.find(c=>!c.end)||null;
  const done=cycles.filter(c=>c.end);
  let learned=null;
  if(done.length){
    const counts=done.map(c=>usesBetween(itemId,c.start,c.end)).filter(n=>n>0);
    if(counts.length) learned=Math.round(counts.reduce((a,b)=>a+b,0)/counts.length);
  }
  let currentUses=0, daysUsed=0, remainPct=null;
  if(current){
    currentUses=usesBetween(itemId,current.start,null);
    daysUsed=Math.max(0, Math.round((new Date(todayKey+'T00:00:00')-new Date(current.start+'T00:00:00'))/86400000));
    if(learned) remainPct=Math.max(0, Math.round(100*(1-currentUses/learned)));
  }
  return {current, learned, currentUses, daysUsed, remainPct, doneCount:done.length};
}

function computeBottleNotices(){
  const out=[];
  consumableItems().forEach(it=>{
    const b=bottleInfo(it.id);
    if(!b.current || b.remainPct===null) return;
    const name=shortName(it.id);
    if(b.remainPct<=0){
      out.push({lv:'alert', html:`🧴 <b>${name}</b>：推定の使い切り回数（約${b.learned}回）に到達。新品の用意を！使い切ったら「🏁」も忘れずに。`});
    }else if(b.remainPct<=20){
      out.push({lv:'note', html:`🧴 <b>${name}</b>：残り約${b.remainPct}%。そろそろ買い足しを。`});
    }
  });
  return out;
}

/* ===========================================================
   警告エンジン（spec.md §5）
   =========================================================== */
function itemsOf(rec){
  if(!rec || rec.noCare) return [];
  return Object.values(rec.slots||{}).flat();
}
function recordsBefore(date){
  return loadLog().filter(r=>r.date<date).sort((a,b)=>b.date.localeCompare(a.date));
}
function recordsInWindow(date, days){
  const d=new Date(date+'T00:00:00'); d.setDate(d.getDate()-days);
  const cut=dateKeyOf(d);
  return loadLog().filter(r=>r.date>=cut && r.date<date);
}
function catCount(records, cat){
  let c=0;
  records.forEach(r=>itemsOf(r).forEach(id=>{ if(itemCat(id)===cat) c++; }));
  return c;
}

function computeWarnings(){
  const out=[];
  if(!state.shift || state.noCare) return out;

  const prev = recordsBefore(state.editDate)[0]||null;
  const prevHadRetinol = prev && itemsOf(prev).some(id=>itemCat(id)===CAT.retinol);

  if(prevHadRetinol){
    out.push({lv:'alert', html:`<b>翌朝UV必須</b>：前回レチノールを使用。朝は日焼け止めを必ず。（オールインワンにUV機能なし）`});
  }
  if(state.shift==='after'){
    out.push({lv:'note', html:`<b>夜勤明け</b>：帰宅後（朝）は攻めスキップ（守りのみ）。夜の就寝前はフルでOK。`});
  }
  const ret7 = catCount(recordsInWindow(state.editDate,7), CAT.retinol);
  if(ret7>=3){
    out.push({lv:'note', html:`<b>レチノール頻度</b>：直近7日で${ret7}回。週2〜3回が目安、今夜は控えめに。`});
  }
  if(prevHadRetinol && (state.shift==='early'||state.shift==='late'||state.shift==='off')){
    out.push({lv:'note', html:`今夜は<b>レチノール↔美顔器</b>どちらか一方。前回レチノールなら今夜は美顔器でもOK（同じ夜に両方はNG）。`});
  }
  const pao7 = catCount(recordsInWindow(state.editDate,7), CAT.pao);
  if(pao7>=5){
    out.push({lv:'note', html:`<b>PAO</b>：直近7日で${pao7}回。週2日は休息を。今日は休んでも◎。`});
  }
  return out;
}

/* ===========================================================
   描画
   =========================================================== */
function fmtHeader(){
  const d=new Date(); const w=['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w}）`;
}
function fmtMD(key){
  const p=key.split('-');
  return `${Number(p[1])}/${Number(p[2])}`;
}

function renderBanner(){
  const el=document.getElementById('banner'); el.innerHTML='';

  if(state.editDate!==todayKey){
    const d=document.createElement('div');
    d.className='banner edit';
    d.innerHTML=`📝 <b>${dayLabelOf(state.editDate)}の記録を編集中</b>（変更後は「記録を保存」を押してください）
      <div class="row"><button class="bbtn ghost" id="backToday">✅ 今日に戻る</button></div>`;
    el.appendChild(d);
    d.querySelector('#backToday').onclick=()=>{ loadStateFor(todayKey); renderAll(); };
    return;
  }

  const missing=[];
  for(let i=1;i<=7;i++){
    const dt=new Date(); dt.setDate(dt.getDate()-i);
    const k=dateKeyOf(dt);
    if(!getRec(k)) missing.push(k);
  }
  if(!missing.length) return;

  const d=document.createElement('div');
  d.className='banner';
  const hasY=missing.includes(yesterdayKey);
  const others=missing.filter(k=>k!==yesterdayKey);
  let html='';
  if(hasY){
    html+=`💭 昨日（${fmtMD(yesterdayKey)}）の記録がありません。
      <div class="row">
        <button class="bbtn primary" id="fillY">昨日の分をつける</button>
        <button class="bbtn" id="ncY">昨日はノーケアだった</button>
      </div>`;
  }
  if(others.length){
    html+=`<div style="margin-top:${hasY?'9px':'0'};">📅 ほかに未記録の日（タップでさかのぼり記録）：</div>
      <div class="chips">${others.map(k=>`<button class="chip" data-d="${k}">${fmtMD(k)}</button>`).join('')}</div>`;
  }
  d.innerHTML=html;
  el.appendChild(d);
  if(hasY){
    d.querySelector('#fillY').onclick=()=>{ loadStateFor(yesterdayKey); renderAll(); };
    d.querySelector('#ncY').onclick=()=>{
      upsertRec({date:yesterdayKey, shift:null, noCare:true, slots:{}});
      flashToast(); renderAll();
    };
  }
  d.querySelectorAll('.chip').forEach(c=>{
    c.onclick=()=>{ loadStateFor(c.getAttribute('data-d')); renderAll(); window.scrollTo(0,0); };
  });
}

function renderShifts(){
  document.getElementById('shiftLabel').textContent =
    state.editDate===todayKey ? '① 今日のシフト' : `① ${dayLabelOf(state.editDate)}のシフト`;
  const el=document.getElementById('shifts'); el.innerHTML='';
  SHIFTS.forEach(s=>{
    const b=document.createElement('button');
    b.className='shift-btn'+(state.shift===s.id?' active':'');
    b.innerHTML=s.label+(s.sub?`<small>${s.sub}</small>`:'<small>&nbsp;</small>');
    b.onclick=()=>{
      state.shift=s.id;
      if(state.editDate===todayKey) localStorage.setItem(LS_SHIFT,s.id);
      // 新しいシフトに存在しない枠のチェックは外す
      const valid=new Set();
      slotsFor(s.id, prevWasNight()).forEach(sl=>{
        sl.steps.forEach(st=>{
          activeItems().filter(it=>st.cats.includes(it.cat)).forEach(it=>valid.add(sl.key+':'+it.id));
        });
      });
      state.checked=new Set([...state.checked].filter(uid=>valid.has(uid)));
      markDirty();
      renderAll();
    };
    el.appendChild(b);
  });
}

function prevWasNight(){
  const prev=getRec(dayBefore(state.editDate));
  return !!(prev && prev.shift==='night');
}

function renderWarnings(){
  const el=document.getElementById('warns'); el.innerHTML='';
  [...computeWarnings(), ...computeBottleNotices()].forEach(w=>{
    const d=document.createElement('div');
    d.className='warn '+(w.lv==='alert'?'alert':'note');
    d.innerHTML=`<span class="ic">${w.lv==='alert'?'⚠️':'💡'}</span><div>${w.html}</div>`;
    el.appendChild(d);
  });
}

function renderNoCare(){
  const el=document.getElementById('nocareArea'); el.innerHTML='';
  const dayWord = dayWordOf(state.editDate);

  if(state.noCare){
    const d=document.createElement('div');
    d.className='nocare-card';
    d.innerHTML=`<span class="big">🚫</span>${dayWord}は<b>ノーケアの日</b>。<br>
      そういう日があってもOK。次の日はフルケアで再開！<br>
      「記録を保存」を押すと確定します。<br>
      <button id="undoNc">取り消してケアを記録する</button>`;
    el.appendChild(d);
    d.querySelector('#undoNc').onclick=()=>{ state.noCare=false; markDirty(); renderAll(); };
    return;
  }

  const b=document.createElement('button');
  b.className='nocare-link';
  b.textContent=`🚫 ${dayWord}は何もしなかった（ノーケアとして記録）`;
  b.onclick=()=>{ state.noCare=true; markDirty(); renderAll(); };
  el.appendChild(b);
}

/* 攻め排他：同じ枠のもう一方の攻めステップのチェックを外す */
function clearOtherAttack(slot, exceptStep){
  slot.steps.forEach(st=>{
    if(st===exceptStep || st.choice!=='attack') return;
    activeItems().filter(it=>st.cats.includes(it.cat)).forEach(it=>{
      state.checked.delete(slot.key+':'+it.id);
    });
  });
}

function renderRoutine(){
  const root=document.getElementById('routine'); root.innerHTML='';
  updateSaveBtn();
  if(state.noCare) return;
  if(!state.shift){
    root.innerHTML='<div class="card empty">上でシフトを選ぶと、ケア手順が表示されます。<br>やったものをタップ → 最後に「記録を保存」。</div>';
    return;
  }

  slotsFor(state.shift, prevWasNight()).forEach(slot=>{
    const meta=SLOT_META[slot.key];
    const h=document.createElement('div');
    h.className='block-title';
    h.innerHTML=`<span class="em">${meta.icon}</span>${slot.label||meta.label}`;
    root.appendChild(h);

    if(slot.hint){
      const hd=document.createElement('div');
      hd.className='auto-hint';
      hd.textContent='ℹ️ '+slot.hint;
      root.appendChild(hd);
    }

    const attackSteps=slot.steps.filter(s=>s.choice==='attack');
    if(attackSteps.length>=2){
      const hint=document.createElement('div');
      hint.className='choice-hint';
      hint.textContent='※ レチノール と 美顔器 は同じ夜にNG。どちらか一方を選んでチェック。';
      root.appendChild(hint);
    }

    const ul=document.createElement('ul'); ul.className='steps';
    slot.steps.forEach(step=>{
      const its=activeItems().filter(it=>step.cats.includes(it.cat));
      if(!its.length) return;  // このカテゴリのアイテム未登録 → ステップ非表示

      if(its.length===1){
        /* 商品が1つ → 行タップで記録（従来どおり） */
        const it=its[0];
        const uid=slot.key+':'+it.id;
        const checked=state.checked.has(uid);
        const li=document.createElement('li');
        li.className='step'+(checked?' checked':'');
        const note = step.note || it.note || '';
        li.innerHTML=`
          <div class="box">${checked?'✓':''}</div>
          <div class="step-body">
            <div class="step-name">${it.name}</div>
            ${note?`<div class="step-note">${note}</div>`:''}
            <span class="cat">${it.cat}${step.choice?' · どちらか一方':''}</span>
          </div>`;
        li.onclick=()=>{
          if(checked){ state.checked.delete(uid); }
          else{
            state.checked.add(uid);
            if(step.choice==='attack') clearOtherAttack(slot, step);
          }
          markDirty();
          renderRoutine();
        };
        ul.appendChild(li);
      }else{
        /* 同カテゴリに複数商品 → 使った商品を選ぶ */
        const anyChecked=its.some(it=>state.checked.has(slot.key+':'+it.id));
        const li=document.createElement('li');
        li.className='step multi'+(anyChecked?' checked':'');
        const label=step.label || itemCatLabel(step.cats);
        const note=step.note||'';
        li.innerHTML=`
          <div class="box">${anyChecked?'✓':''}</div>
          <div class="step-body">
            <div class="step-name">${label} <span style="font-weight:400;color:var(--sub);font-size:.8rem">— 使った方をタップ</span></div>
            ${note?`<div class="step-note">${note}</div>`:''}
            <div class="item-chips">${its.map(it=>{
              const on=state.checked.has(slot.key+':'+it.id);
              return `<button class="ichip${on?' on':''}" data-uid="${slot.key+':'+it.id}">${shortName(it.id)}</button>`;
            }).join('')}</div>
            <span class="cat">${step.cats.join('・')}${step.choice?' · どちらか一方':''}</span>
          </div>`;
        li.querySelectorAll('.ichip').forEach(ch=>{
          ch.onclick=(ev)=>{
            ev.stopPropagation();
            const uid=ch.getAttribute('data-uid');
            if(state.checked.has(uid)){ state.checked.delete(uid); }
            else{
              state.checked.add(uid);
              if(step.choice==='attack') clearOtherAttack(slot, step);
            }
            markDirty();
            renderRoutine();
          };
        });
        ul.appendChild(li);
      }
    });
    root.appendChild(ul);
  });
}
function itemCatLabel(cats){
  // 「洗顔(通常)・洗顔(クレイ)」→「洗顔」のように共通部分があれば縮める
  if(cats.length===1) return cats[0];
  const first=cats[0].split('(')[0];
  if(cats.every(c=>c.split('(')[0]===first)) return first;
  return cats.join('・');
}

function shiftLabelOf(id){
  if(!id) return '—';
  const s=SHIFTS.find(x=>x.id===id); return s?s.label:id;
}

function renderHistory(){
  const el=document.getElementById('histList');
  const log=loadLog().slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!log.length){ el.innerHTML='<div class="empty">まだ記録がありません。</div>'; return; }
  el.innerHTML='';
  const order=['kitaku','m','kishou','shukkin','n'];
  log.forEach(r=>{
    const div=document.createElement('div'); div.className='hist-item';
    let body;
    if(r.noCare){
      body='🚫 ノーケア（何もしなかった日）';
    }else{
      const prevN=(()=>{ const p=loadLog().find(x=>x.date===dayBefore(r.date)); return !!(p&&p.shift==='night'); })();
      const defined=slotsFor(r.shift, prevN).map(s=>s.key);
      const lines=[];
      order.forEach(k=>{
        const ids=(r.slots||{})[k]||[];
        if(ids.length || defined.includes(k)){
          const meta=SLOT_META[k];
          lines.push(`${meta.icon} ${ids.length ? ids.map(shortName).join('、') : '<span style="color:var(--sub)">—（ケアなし）</span>'}`);
        }
      });
      body=lines.join('<br>')||'—';
    }
    div.innerHTML=`
      <div class="hist-head">
        <span><b>${r.date}</b> <span class="sh">${shiftLabelOf(r.shift)}</span></span>
        <span>
          <button class="hist-del" data-e="${r.date}" style="color:var(--accent);">編集</button>
          <button class="hist-del" data-d="${r.date}">削除</button>
        </span>
      </div>
      <div class="hist-items">${body}</div>`;
    el.appendChild(div);
  });
  el.querySelectorAll('[data-e]').forEach(btn=>{
    btn.onclick=()=>{
      loadStateFor(btn.getAttribute('data-e'));
      renderAll();
      window.scrollTo(0,0);
    };
  });
  el.querySelectorAll('[data-d]').forEach(btn=>{
    btn.onclick=()=>{
      const d=btn.getAttribute('data-d');
      saveLog(loadLog().filter(r=>r.date!==d));
      if(d===state.editDate) loadStateFor(state.editDate);
      renderAll();
    };
  });
}
function renderHistoryIfOpen(){
  if(document.getElementById('histList').style.display!=='none') renderHistory();
}

/* ===========================================================
   マイアイテム管理
   =========================================================== */
let editingItemId=null;

function renderItems(){
  const el=document.getElementById('itemsPanel');
  el.innerHTML='';

  const addBtn=document.createElement('button');
  addBtn.className='add-item-btn';
  addBtn.textContent='＋ アイテムを追加';
  addBtn.onclick=()=>{ editingItemId='__new__'; renderItems(); };
  el.appendChild(addBtn);

  if(editingItemId==='__new__') el.appendChild(buildItemForm(null));

  const act=activeItems(), arch=allItems().filter(i=>i.archived);

  act.forEach(it=>{
    if(editingItemId===it.id){ el.appendChild(buildItemForm(it)); return; }
    const row=document.createElement('div'); row.className='item-row';
    row.innerHTML=`
      <div>
        <div class="nm">${it.name}</div>
        <div class="meta">${it.cat}${it.note?'・'+it.note:''}</div>
      </div>
      <div class="item-acts">
        <button class="edit" data-ed="${it.id}">✏️ 編集</button>
        <button data-ar="${it.id}">使わない</button>
      </div>`;
    el.appendChild(row);
  });

  if(arch.length){
    const h=document.createElement('div');
    h.className='meta';
    h.style.cssText='margin-top:12px;font-size:.76rem;color:var(--sub);font-weight:600;';
    h.textContent=`▾ 使っていないアイテム（${arch.length}）`;
    el.appendChild(h);
    arch.forEach(it=>{
      const row=document.createElement('div'); row.className='item-row archived';
      row.innerHTML=`
        <div><div class="nm">${it.name}</div><div class="meta">${it.cat}</div></div>
        <div class="item-acts"><button data-un="${it.id}">戻す</button></div>`;
      el.appendChild(row);
    });
  }

  el.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{ editingItemId=b.getAttribute('data-ed'); renderItems(); });
  el.querySelectorAll('[data-ar]').forEach(b=>b.onclick=()=>{
    const id=b.getAttribute('data-ar');
    if(!confirm(shortName(id)+' を「使わない」にしますか？\n（ルーティンに出なくなります。過去の記録はそのまま残ります。いつでも戻せます）')) return;
    const arr=allItems(); const it=arr.find(x=>x.id===id); if(it) it.archived=true;
    saveItems(arr); afterItemsChanged();
  });
  el.querySelectorAll('[data-un]').forEach(b=>b.onclick=()=>{
    const arr=allItems(); const it=arr.find(x=>x.id===b.getAttribute('data-un')); if(it) delete it.archived;
    saveItems(arr); afterItemsChanged();
  });
}

function buildItemForm(it){
  const f=document.createElement('div'); f.className='item-form';
  const cats=Object.values(CAT);
  f.innerHTML=`
    <label>商品名 *</label>
    <input type="text" id="fName" value="${it?it.name.replace(/"/g,'&quot;'):''}" placeholder="例：VARON オールインワンセラム">
    <label>カテゴリ *（ルーティンのどの役割か）</label>
    <select id="fCat">${cats.map(c=>`<option${it&&it.cat===c?' selected':''}>${c}</option>`).join('')}</select>
    <label>メモ（任意）</label>
    <input type="text" id="fNote" value="${it&&it.note?it.note.replace(/"/g,'&quot;'):''}" placeholder="例：乾燥の日用">
    <div class="row">
      <button class="bbtn primary" id="fSave">${it?'保存':'登録'}</button>
      <button class="bbtn" id="fCancel">キャンセル</button>
    </div>`;
  f.querySelector('#fCancel').onclick=()=>{ editingItemId=null; renderItems(); };
  f.querySelector('#fSave').onclick=()=>{
    const name=f.querySelector('#fName').value.trim();
    const cat=f.querySelector('#fCat').value;
    const note=f.querySelector('#fNote').value.trim();
    if(!name){ alert('商品名を入れてください。'); return; }
    const arr=allItems();
    if(it){
      const t=arr.find(x=>x.id===it.id);
      t.name=name; t.cat=cat; t.note=note;
    }else{
      arr.push({id:newItemId(), name, cat, note});
    }
    saveItems(arr);
    editingItemId=null;
    flashToast('✓ アイテムを保存しました');
    afterItemsChanged();
  };
  return f;
}

function afterItemsChanged(){
  renderItems();
  renderRoutine();
  renderWarnings();
  renderBottlesIfOpen();
}

/* ===========================================================
   ボトル管理 描画
   =========================================================== */
function renderBottles(){
  const el=document.getElementById('bottleList');
  el.innerHTML='';
  const list=consumableItems();
  if(!list.length){ el.innerHTML='<div class="empty">対象アイテムがありません。</div>'; return; }
  list.forEach(it=>{
    const id=it.id;
    const b=bottleInfo(id);
    const row=document.createElement('div'); row.className='bottle-row';
    let sub='', bar='', btn='';
    if(!b.current){
      sub = b.doneCount
        ? `これまで${b.doneCount}本使い切り${b.learned?`・1本あたり約${b.learned}回`:''}`
        : 'まだ計測していません。新品をおろす日にスタート！';
      btn = `<button class="bottle-btn" data-act="start" data-id="${id}">🆕 新品おろした</button>`;
    }else{
      const since=`開始 ${fmtMD(b.current.start)}・${b.currentUses}回使用・${b.daysUsed}日経過`;
      if(b.remainPct===null){
        sub=`${since}<br>（1本目を計測中。使い切ると残量を推定できるようになります）`;
      }else{
        sub=`${since}・残り約${b.remainPct}%（1本≈${b.learned}回）`;
        const cls=b.remainPct<=0?'empty':(b.remainPct<=20?'low':'');
        bar=`<div class="bottle-bar"><div class="${cls}" style="width:${Math.max(3,b.remainPct)}%"></div></div>`;
      }
      btn = `<button class="bottle-btn finish" data-act="end" data-id="${id}">🏁 使い切った</button>`;
    }
    row.innerHTML=`<div class="bottle-head"><div><div class="bottle-name">${shortName(id)}</div><div class="bottle-sub">${sub}</div></div>${btn}</div>${bar}`;
    el.appendChild(row);
  });
  el.querySelectorAll('.bottle-btn').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.getAttribute('data-id'), act=btn.getAttribute('data-act');
      const bottles=loadBottles();
      const arr=bottles[id]=bottles[id]||[];
      if(act==='start'){
        if(!confirm(shortName(id)+'：新しいボトルを今日からスタートしますか？')) return;
        arr.push({start:todayKey, end:null});
      }else{
        if(!confirm(shortName(id)+'：今日で使い切りましたか？（1本の寿命として学習します）')) return;
        const cur=arr.find(c=>!c.end);
        if(cur) cur.end=todayKey;
      }
      saveBottles(bottles);
      flashToast();
      renderBottles(); renderWarnings();
    };
  });
}
function renderBottlesIfOpen(){
  if(document.getElementById('bottleList').style.display!=='none') renderBottles();
}

/* ===========================================================
   バックアップ（書き出し／読み込み）
   =========================================================== */
function buildBackup(){
  return {
    app:'MyCareLog', format:7, exported:todayKey,
    log:loadLog(), bottles:loadBottles(), items:allItems(),
    shiftToday:localStorage.getItem(LS_SHIFT)||null,
  };
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(buildBackup(),null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`mycarelog-backup-${todayKey}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  flashToast('📤 バックアップを書き出しました');
}
function applyBackup(data){
  if(!data || data.app!=='MyCareLog' || !Array.isArray(data.log)){
    alert('MyCareLogのバックアップファイルではないようです。');
    return false;
  }
  saveLog(data.log);
  if(data.bottles) saveBottles(data.bottles);
  if(Array.isArray(data.items)&&data.items.length) saveItems(data.items);
  if(data.shiftToday) localStorage.setItem(LS_SHIFT, data.shiftToday);
  return true;
}

/* ===========================================================
   全体描画・初期化
   =========================================================== */
function renderAll(){
  renderBanner();
  renderShifts();
  renderWarnings();
  renderNoCare();
  renderRoutine();
  renderHistoryIfOpen();
  renderBottlesIfOpen();
}

document.getElementById('today').textContent=fmtHeader();
document.getElementById('saveBtn').onclick=doSave;

function wireToggle(btnId, panelId, title, onOpen){
  document.getElementById(btnId).onclick=function(){
    const l=document.getElementById(panelId);
    const open=l.style.display!=='none';
    l.style.display=open?'none':'block';
    this.textContent=(open?'▸ ':'▾ ')+title;
    if(!open && onOpen) onOpen();
  };
}
wireToggle('itemsToggle','itemsPanel','マイアイテム（登録・編集）',renderItems);
wireToggle('bottleToggle','bottleList','ボトル管理（買い足しタイマー）',renderBottles);
wireToggle('histToggle','histList','記録履歴を見る',renderHistory);
wireToggle('dataToggle','dataPanel','データ管理（バックアップ）');

document.getElementById('exportBtn').onclick=exportBackup;
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=function(){
  const file=this.files[0];
  this.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    let data=null;
    try{ data=JSON.parse(reader.result); }catch(e){}
    if(!data){ alert('ファイルを読み込めませんでした。'); return; }
    const days=Array.isArray(data.log)?data.log.length:0;
    if(!confirm(`${data.exported||'?'} 時点のバックアップ（記録${days}日分）を読み込みますか？\n今この端末にある記録は置き換わります。`)) return;
    if(applyBackup(data)){
      flashToast('📥 読み込みました');
      setTimeout(()=>location.reload(),600);
    }
  };
  reader.readAsText(file);
};

loadStateFor(todayKey);
renderAll();
</script>
