<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3a6ea5">
<title>MyCareLog — 今日のケア</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1d2733; --sub:#6b7785;
    --line:#e3e8ee; --accent:#3a6ea5; --accent-soft:#e8f0f8;
    --warn-bg:#fff4e5; --warn-line:#f0c089; --warn-ink:#8a5200;
    --danger-bg:#fdecec; --danger-line:#f0a3a3; --danger-ink:#a32020;
    --done:#2e9e6b; --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    background:var(--bg); color:var(--ink);
    line-height:1.6; font-size:16px;
    padding:0 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px; margin:0 auto; padding:16px 14px 40px;}
  header{padding:8px 2px 14px;}
  header h1{font-size:1.15rem; margin:0; letter-spacing:.02em;}
  header .date{color:var(--sub); font-size:.82rem; margin-top:2px;}

  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px; margin-bottom:14px;
    box-shadow:0 1px 2px rgba(20,40,70,.04);
  }
  .label{font-size:.78rem; color:var(--sub); font-weight:600; letter-spacing:.04em; margin-bottom:8px;}

  /* お知らせ・編集バナー */
  .banner{
    border-radius:12px; padding:11px 13px; margin-bottom:14px; font-size:.88rem;
    background:var(--accent-soft); border:1px solid #bcd4ea; color:#27537e;
  }
  .banner.edit{background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn-ink);}
  .banner .row{display:flex; gap:8px; margin-top:9px;}
  .bbtn{
    flex:1; border:1px solid var(--accent); background:#fff; color:var(--accent);
    border-radius:9px; padding:9px 6px; font-size:.84rem; font-weight:600; cursor:pointer;
  }
  .bbtn.primary{background:var(--accent); color:#fff;}
  .bbtn.ghost{border-color:var(--warn-line); color:var(--warn-ink);}

  /* シフト選択 */
  .shifts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .shift-btn{
    border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:10px; padding:10px 4px; font-size:.86rem; font-weight:600;
    cursor:pointer; transition:.12s; text-align:center; line-height:1.25;
  }
  .shift-btn small{display:block; font-weight:400; font-size:.68rem; color:var(--sub); margin-top:2px;}
  .shift-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .shift-btn.active small{color:rgba(255,255,255,.85);}

  /* 警告 */
  .warns{margin-bottom:14px;}
  .warn{
    border-radius:12px; padding:11px 13px; margin-bottom:8px;
    font-size:.88rem; display:flex; gap:9px; align-items:flex-start;
    border:1px solid;
  }
  .warn .ic{flex:0 0 auto; font-size:1.05rem; line-height:1.4;}
  .warn.alert{background:var(--danger-bg); border-color:var(--danger-line); color:var(--danger-ink);}
  .warn.note{background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn-ink);}
  .warn b{font-weight:700;}

  /* ノーケア */
  .nocare-link{
    display:block; width:100%; text-align:center; background:none;
    border:1px dashed #cdd6df; color:var(--sub); border-radius:10px;
    padding:9px; font-size:.82rem; cursor:pointer; margin:0 0 14px;
  }
  .nocare-card{
    background:#eef0f3; border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 14px; text-align:center; color:var(--sub); font-size:.9rem; margin-bottom:14px;
  }
  .nocare-card .big{font-size:1.6rem; display:block; margin-bottom:6px;}
  .nocare-card button{
    margin-top:10px; background:none; border:1px solid #cdd6df; color:var(--sub);
    border-radius:9px; padding:7px 14px; font-size:.8rem; cursor:pointer;
  }

  /* ルーティン */
  .block-title{
    font-size:.95rem; font-weight:700; margin:18px 2px 8px; display:flex;
    align-items:center; gap:7px;
  }
  .block-title .em{font-size:1.1rem;}
  .steps{list-style:none; margin:0; padding:0;}
  .step{
    display:flex; align-items:flex-start; gap:11px;
    padding:11px 12px; border:1px solid var(--line); border-radius:12px;
    background:#fff; margin-bottom:8px; cursor:pointer; transition:.12s;
  }
  .step.checked{background:#f1faf5; border-color:#bfe6d2;}
  .box{
    flex:0 0 auto; width:22px; height:22px; border-radius:7px;
    border:2px solid #cdd6df; margin-top:1px; display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:.8rem; transition:.12s;
  }
  .step.checked .box{background:var(--done); border-color:var(--done);}
  .step-body{flex:1; min-width:0;}
  .step-name{font-size:.95rem; font-weight:600;}
  .step.checked .step-name{color:var(--sub); text-decoration:line-through;}
  .step-note{font-size:.76rem; color:var(--sub); margin-top:1px;}
  .step .cat{
    display:inline-block; font-size:.66rem; color:var(--accent);
    background:var(--accent-soft); border-radius:5px; padding:1px 6px; margin-top:4px;
  }
  .choice-hint{
    font-size:.78rem; color:var(--warn-ink); background:var(--warn-bg);
    border:1px dashed var(--warn-line); border-radius:9px; padding:7px 10px; margin:0 0 8px;
  }
  .empty{color:var(--sub); font-size:.88rem; padding:6px 2px;}

  /* 自動保存トースト */
  #toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:rgba(29,39,51,.88); color:#fff; padding:8px 16px;
    border-radius:20px; font-size:.82rem; opacity:0; transition:.25s;
    pointer-events:none; z-index:9; white-space:nowrap;
  }
  #toast.show{opacity:1;}

  /* 履歴 */
  .hist-toggle{
    background:none; border:none; color:var(--accent); font-size:.86rem;
    font-weight:600; cursor:pointer; padding:6px 2px; display:flex; align-items:center; gap:5px;
  }
  .hist-list{margin-top:6px;}
  .hist-item{
    border-top:1px solid var(--line); padding:10px 2px; font-size:.84rem;
  }
  .hist-item:first-child{border-top:none;}
  .hist-head{display:flex; justify-content:space-between; color:var(--sub); margin-bottom:3px;}
  .hist-head .sh{color:var(--accent); font-weight:600;}
  .hist-items{color:var(--ink); line-height:1.7;}
  .hist-del{color:var(--danger-ink); background:none; border:none; font-size:.78rem; cursor:pointer;}
  footer{text-align:center; color:var(--sub); font-size:.72rem; margin-top:24px; line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✨ MyCareLog</h1>
    <div class="date" id="today"></div>
  </header>

  <!-- 昨日の記録なし案内／昨日編集中バナー -->
  <div id="banner"></div>

  <!-- ① シフト -->
  <div class="card">
    <div class="label" id="shiftLabel">① 今日のシフト</div>
    <div class="shifts" id="shifts"></div>
  </div>

  <!-- 警告 -->
  <div class="warns" id="warns"></div>

  <!-- ノーケア -->
  <div id="nocareArea"></div>

  <!-- ② ルーティン -->
  <div id="routine"></div>

  <!-- ③ 履歴 -->
  <div class="card" style="margin-top:18px;">
    <button class="hist-toggle" id="histToggle">▸ 記録履歴を見る</button>
    <div class="hist-list" id="histList" style="display:none;"></div>
  </div>

  <footer>
    タップするたびに自動で保存されます（保存ボタンは不要）。<br>
    記録は端末内（localStorage）にのみ保存されます。<br>
    叩き台 v0.2 — 朝夜別記録・自動保存・昨日のさかのぼり・ノーケア対応。
  </footer>
</div>
<div id="toast">✓ 保存しました</div>

<script>
"use strict";

/* ===========================================================
   データモデル（spec.md §2,§3 準拠）
   =========================================================== */
const CAT = {
  cleanseOil:'クレンジングオイル', washNormal:'洗顔(通常)', washClay:'洗顔(クレイ)',
  toner:'化粧水', serumGuard:'守りの美容液', retinol:'レチノール類',
  cream:'クリーム', allinone:'オールインワン', uv:'日焼け止め',
  device:'美顔器', pao:'表情筋トレ'
};

const ITEMS = {
  pao:        {name:'PAO（表情筋トレ）',          cat:CAT.pao,        note:'歯磨き後・素肌・週5日'},
  toner:      {name:'トリートメントソフナー',       cat:CAT.toner,      note:'全ケアの土台'},
  ocher:      {name:'OCHER ザ セラム',            cat:CAT.allinone,   note:'時短オールインワン（UV機能なし）'},
  uvMain:     {name:'Bioré UV アスリズム',         cat:CAT.uv,         note:'朝・メインUV'},
  uvStick:    {name:'Clear Stick UV（携帯）',      cat:CAT.uv,         note:'外出先の塗り直し用'},
  cleanseOil: {name:'マイルドクレンジングオイル',    cat:CAT.cleanseOil, note:'乾いた肌・乳化して流す'},
  washBiore:  {name:'メンズビオレ ザフェイス',       cat:CAT.washNormal, note:'通常洗顔（泥ジェルと交互）'},
  washFancl:  {name:'FANCL 泥ジェル洗顔',          cat:CAT.washClay,   note:'軽く濡らした肌・週3-4回'},
  serum:      {name:'アルティミューン セラム',       cat:CAT.serumGuard, note:'守り・毎晩必須'},
  retinol:    {name:'ANUA レチノール0.3',          cat:CAT.retinol,    note:'攻め・週2〜3回・翌朝UV必須'},
  cream:      {name:'スキンエンパワリングクリーム',   cat:CAT.cream,      note:'毎晩・美顔器併用OK'},
  device:     {name:'STELLA BEAUTE 美顔器',        cat:CAT.device,     note:'数日に1回・ANUAと同夜NG'},
};

const SHIFTS = [
  {id:'early',  label:'早番',     sub:''},
  {id:'late',   label:'遅番',     sub:''},
  {id:'night',  label:'夜勤',     sub:'出勤前'},
  {id:'after',  label:'夜勤明け',  sub:'攻め休み'},
  {id:'off1',   label:'休み1日目', sub:'最小限'},
  {id:'off2',   label:'休み2日目', sub:'フル'},
];

const morningWork = () => [
  {item:'pao'}, {item:'toner'}, {item:'ocher'},
];
const nightFull = () => [
  {item:'cleanseOil'},
  {item:'washBiore', alt:'washFancl', altLabel:'メンズビオレ or FANCL泥ジェル（交互）'},
  {item:'toner'},
  {item:'serum'},
  {item:'retinol', choice:'attack'},
  {item:'cream'},
  {item:'device', choice:'attack'},
];
const nightAfter = () => [
  {item:'cleanseOil', note:'肌の状態次第で'},
  {item:'washBiore', alt:'washFancl', altLabel:'通常洗顔のみ（泥ジェルのパック/マッサージNG）'},
  {item:'toner'},
  {item:'serum'},
  {item:'cream'},
];
const minimal = () => [
  {item:'pao', note:'余裕があれば'}, {item:'toner'}, {item:'ocher'},
];

const ROUTINES = {
  early: {morning:morningWork(), night:nightFull()},
  late:  {morning:morningWork(), night:nightFull()},
  night: {morning:morningWork(), night:null},
  after: {morning:null,          night:nightAfter()},
  off1:  {morning:minimal(),     night:null},
  off2:  {morning:null,          night:nightFull()},
};

/* ===========================================================
   保存（v2：朝/夜別・ノーケア対応）
   record = {date, shift, morning:[id], night:[id], noCare:bool}
   =========================================================== */
const LS_V1 = 'mcl_log_v1';
const LS_LOG = 'mcl_log_v2';
const LS_SHIFT = 'mcl_shift_today';

function pad(n){ return String(n).padStart(2,'0'); }
function dateKeyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
const todayKey = dateKeyOf(new Date());
const yesterdayKey = (()=>{ const d=new Date(); d.setDate(d.getDate()-1); return dateKeyOf(d); })();

function loadLog(){ try{return JSON.parse(localStorage.getItem(LS_LOG))||[];}catch(e){return [];} }
function saveLog(log){ localStorage.setItem(LS_LOG, JSON.stringify(log)); }
function getRec(date){ return loadLog().find(r=>r.date===date)||null; }
function upsertRec(rec){
  const log=loadLog();
  const i=log.findIndex(r=>r.date===rec.date);
  if(i>=0) log[i]=rec; else log.push(rec);
  saveLog(log);
}

// 旧形式（v1：itemsひとまとめ）からの引き継ぎ。朝/夜はシフトの手順表から推定。
(function migrateV1(){
  if(localStorage.getItem(LS_LOG)) return;
  let old=null;
  try{ old=JSON.parse(localStorage.getItem(LS_V1)); }catch(e){}
  if(!old||!Array.isArray(old)) return;
  const conv=old.map(r=>{
    const morning=[], night=[];
    const rt=ROUTINES[r.shift]||{};
    const mIds=(rt.morning||[]).map(s=>s.item);
    (r.items||[]).forEach(id=>{ (mIds.includes(id)?morning:night).push(id); });
    return {date:r.date, shift:r.shift, morning, night, noCare:false};
  });
  saveLog(conv);
})();

/* ===========================================================
   状態（editDate：今日 or 昨日）
   =========================================================== */
let state = { editDate: todayKey, shift: null, noCare: false, checked: new Set() };

function loadStateFor(date){
  state.editDate = date;
  const rec = getRec(date);
  if(rec){
    state.shift = rec.shift;
    state.noCare = !!rec.noCare;
    state.checked = new Set([
      ...(rec.morning||[]).map(id=>'morning:'+id),
      ...(rec.night||[]).map(id=>'night:'+id),
    ]);
  }else{
    state.shift = (date===todayKey) ? (localStorage.getItem(LS_SHIFT)||null) : null;
    state.noCare = false;
    state.checked = new Set();
  }
}

function persist(){
  if(!state.shift && !state.noCare) return;
  const morning=[], night=[];
  state.checked.forEach(uid=>{
    const i = uid.indexOf(':');
    const p = uid.slice(0,i), id = uid.slice(i+1);
    (p==='morning'?morning:night).push(id);
  });
  upsertRec({
    date: state.editDate,
    shift: state.shift,
    noCare: state.noCare,
    morning: state.noCare ? [] : morning,
    night: state.noCare ? [] : night,
  });
  flashToast();
  renderHistoryIfOpen();
}

let toastTimer=null;
function flashToast(){
  const t=document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1200);
}

/* ===========================================================
   警告エンジン（spec.md §5）— editDate より前の記録から判定
   =========================================================== */
function itemsOf(rec){
  if(!rec || rec.noCare) return [];
  return [...(rec.morning||[]), ...(rec.night||[])];
}
function recordsBefore(date){
  return loadLog().filter(r=>r.date<date).sort((a,b)=>b.date.localeCompare(a.date));
}
function recordsInWindow(date, days){
  const d=new Date(date+'T00:00:00'); d.setDate(d.getDate()-days);
  const cut=dateKeyOf(d);
  return loadLog().filter(r=>r.date>=cut && r.date<date);
}
function catCount(records, cat){
  let c=0;
  records.forEach(r=>itemsOf(r).forEach(id=>{ if(ITEMS[id]&&ITEMS[id].cat===cat) c++; }));
  return c;
}

function computeWarnings(){
  const out=[];
  if(!state.shift || state.noCare) return out;

  const prev = recordsBefore(state.editDate)[0]||null;
  const prevHadRetinol = prev && itemsOf(prev).some(id=>ITEMS[id]&&ITEMS[id].cat===CAT.retinol);

  if(prevHadRetinol){
    out.push({lv:'alert', html:`<b>翌朝UV必須</b>：前回レチノールを使用。朝は日焼け止めを必ず。（OCHERにUV機能なし）`});
  }
  if(state.shift==='after'){
    out.push({lv:'note', html:`<b>夜勤明け</b>：レチノール・美顔器・泥ジェルのパックはスキップ（守りのみ）。`});
  }
  const ret7 = catCount(recordsInWindow(state.editDate,7), CAT.retinol);
  if(ret7>=3){
    out.push({lv:'note', html:`<b>レチノール頻度</b>：直近7日で${ret7}回。週2〜3回が目安、今夜は控えめに。`});
  }
  if(prevHadRetinol && (state.shift==='early'||state.shift==='late'||state.shift==='off2')){
    out.push({lv:'note', html:`今夜は<b>レチノール↔美顔器</b>どちらか一方。前回レチノールなら今夜は美顔器でもOK（同じ夜に両方はNG）。`});
  }
  const pao7 = catCount(recordsInWindow(state.editDate,7), CAT.pao);
  if(pao7>=5){
    out.push({lv:'note', html:`<b>PAO</b>：直近7日で${pao7}回。週2日は休息を。今日は休んでも◎。`});
  }
  return out;
}

/* ===========================================================
   描画
   =========================================================== */
function fmtHeader(){
  const d=new Date(); const w=['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w}）`;
}
function fmtMD(key){
  const p=key.split('-');
  return `${Number(p[1])}/${Number(p[2])}`;
}
function isEditingYesterday(){ return state.editDate===yesterdayKey; }

function renderBanner(){
  const el=document.getElementById('banner'); el.innerHTML='';

  if(isEditingYesterday()){
    const d=document.createElement('div');
    d.className='banner edit';
    d.innerHTML=`📝 <b>昨日（${fmtMD(yesterdayKey)}）の記録を編集中</b>
      <div class="row"><button class="bbtn ghost" id="backToday">✅ 終わった — 今日に戻る</button></div>`;
    el.appendChild(d);
    d.querySelector('#backToday').onclick=()=>{ loadStateFor(todayKey); renderAll(); };
    return;
  }

  // 今日表示中で、昨日の記録が無いときだけ案内
  if(!getRec(yesterdayKey)){
    const d=document.createElement('div');
    d.className='banner';
    d.innerHTML=`💭 昨日（${fmtMD(yesterdayKey)}）の記録がありません。
      <div class="row">
        <button class="bbtn primary" id="fillY">昨日の分をつける</button>
        <button class="bbtn" id="ncY">昨日はノーケアだった</button>
      </div>`;
    el.appendChild(d);
    d.querySelector('#fillY').onclick=()=>{ loadStateFor(yesterdayKey); renderAll(); };
    d.querySelector('#ncY').onclick=()=>{
      upsertRec({date:yesterdayKey, shift:null, noCare:true, morning:[], night:[]});
      flashToast(); renderAll();
    };
  }
}

function renderShifts(){
  document.getElementById('shiftLabel').textContent =
    isEditingYesterday() ? `① 昨日（${fmtMD(yesterdayKey)}）のシフト` : '① 今日のシフト';
  const el=document.getElementById('shifts'); el.innerHTML='';
  SHIFTS.forEach(s=>{
    const b=document.createElement('button');
    b.className='shift-btn'+(state.shift===s.id?' active':'');
    b.innerHTML=s.label+(s.sub?`<small>${s.sub}</small>`:'<small>&nbsp;</small>');
    b.onclick=()=>{
      state.shift=s.id;
      if(state.editDate===todayKey) localStorage.setItem(LS_SHIFT,s.id);
      // 新しいシフトの手順に存在しないチェックは外す
      const valid=new Set();
      const r=ROUTINES[s.id];
      (r.morning||[]).forEach(st=>valid.add('morning:'+st.item));
      (r.night||[]).forEach(st=>valid.add('night:'+st.item));
      state.checked=new Set([...state.checked].filter(uid=>valid.has(uid)));
      persist();
      renderAll();
    };
    el.appendChild(b);
  });
}

function renderWarnings(){
  const el=document.getElementById('warns'); el.innerHTML='';
  computeWarnings().forEach(w=>{
    const d=document.createElement('div');
    d.className='warn '+(w.lv==='alert'?'alert':'note');
    d.innerHTML=`<span class="ic">${w.lv==='alert'?'⚠️':'💡'}</span><div>${w.html}</div>`;
    el.appendChild(d);
  });
}

function renderNoCare(){
  const el=document.getElementById('nocareArea'); el.innerHTML='';
  const dayWord = isEditingYesterday() ? '昨日' : '今日';

  if(state.noCare){
    const d=document.createElement('div');
    d.className='nocare-card';
    d.innerHTML=`<span class="big">🚫</span>${dayWord}は<b>ノーケアの日</b>として記録済み。<br>
      そういう日があってもOK。次の日はフルケアで再開！<br>
      <button id="undoNc">取り消してケアを記録する</button>`;
    el.appendChild(d);
    d.querySelector('#undoNc').onclick=()=>{
      state.noCare=false; persist(); renderAll();
    };
    return;
  }

  const b=document.createElement('button');
  b.className='nocare-link';
  b.textContent=`🚫 ${dayWord}は何もしなかった（ノーケアとして記録）`;
  b.onclick=()=>{
    // チェック済み項目はメモリ上に残す（誤タップでも「取り消し」で復元できる）
    state.noCare=true;
    persist(); renderAll();
  };
  el.appendChild(b);
}

function renderRoutine(){
  const root=document.getElementById('routine'); root.innerHTML='';
  if(state.noCare) return;
  if(!state.shift){
    root.innerHTML='<div class="card empty">上でシフトを選ぶと、ケア手順が表示されます。<br>やったものをタップ → その場で自動保存されます。</div>';
    return;
  }
  const r=ROUTINES[state.shift];
  const blocks=[
    {key:'morning', title:'朝 / 出勤前', em:'🌅', steps:r.morning},
    {key:'night',   title:'夜 / 就寝前', em:'🌙', steps:r.night},
  ];
  let any=false;

  blocks.forEach(b=>{
    if(!b.steps||!b.steps.length) return;
    any=true;
    const h=document.createElement('div');
    h.className='block-title';
    h.innerHTML=`<span class="em">${b.em}</span>${b.title}`;
    root.appendChild(h);

    const hasChoice=b.steps.some(s=>s.choice);
    if(hasChoice){
      const hint=document.createElement('div');
      hint.className='choice-hint';
      hint.textContent='※ レチノール と 美顔器 は同じ夜にNG。どちらか一方を選んでチェック。';
      root.appendChild(hint);
    }

    const ul=document.createElement('ul'); ul.className='steps';
    b.steps.forEach(step=>{
      const it=ITEMS[step.item];
      const uid=b.key+':'+step.item;
      const checked=state.checked.has(uid);
      const li=document.createElement('li');
      li.className='step'+(checked?' checked':'');
      const note = step.note ? step.note : (step.altLabel ? step.altLabel : it.note);
      li.innerHTML=`
        <div class="box">${checked?'✓':''}</div>
        <div class="step-body">
          <div class="step-name">${it.name}${step.alt?' <span style="font-weight:400;color:var(--sub)">／'+ITEMS[step.alt].name+'</span>':''}</div>
          <div class="step-note">${note}</div>
          <span class="cat">${it.cat}${step.choice?' · どちらか一方':''}</span>
        </div>`;
      li.onclick=()=>{
        if(checked){ state.checked.delete(uid); }
        else{
          state.checked.add(uid);
          // 攻め排他：レチノールと美顔器は同夜どちらか一方
          if(step.choice==='attack'){
            b.steps.forEach(other=>{
              if(other!==step && other.choice==='attack') state.checked.delete(b.key+':'+other.item);
            });
          }
        }
        persist();
        renderRoutine();
      };
      ul.appendChild(li);
    });
    root.appendChild(ul);
  });

  if(!any){
    root.innerHTML='<div class="card empty">このシフトに登録ルーティンがありません（叩き台では未設定）。</div>';
  }
}

function shiftLabelOf(id){
  if(!id) return '—';
  const s=SHIFTS.find(x=>x.id===id); return s?s.label:id;
}
function shortName(id){
  return ITEMS[id] ? ITEMS[id].name.replace(/（.*?）/g,'') : id;
}

function renderHistory(){
  const el=document.getElementById('histList');
  const log=loadLog().slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!log.length){ el.innerHTML='<div class="empty">まだ記録がありません。</div>'; return; }
  el.innerHTML='';
  log.forEach(r=>{
    const div=document.createElement('div'); div.className='hist-item';
    let body;
    if(r.noCare){
      body='🚫 ノーケア（何もしなかった日）';
    }else{
      const m=(r.morning||[]).map(shortName).join('、');
      const n=(r.night||[]).map(shortName).join('、');
      body=`🌅 ${m||'—'}<br>🌙 ${n||'—'}`;
    }
    div.innerHTML=`
      <div class="hist-head">
        <span><b>${r.date}</b> <span class="sh">${shiftLabelOf(r.shift)}</span></span>
        <button class="hist-del" data-d="${r.date}">削除</button>
      </div>
      <div class="hist-items">${body}</div>`;
    el.appendChild(div);
  });
  el.querySelectorAll('.hist-del').forEach(btn=>{
    btn.onclick=()=>{
      const d=btn.getAttribute('data-d');
      saveLog(loadLog().filter(r=>r.date!==d));
      if(d===state.editDate) loadStateFor(state.editDate);
      renderAll();
    };
  });
}
function renderHistoryIfOpen(){
  if(document.getElementById('histList').style.display!=='none') renderHistory();
}

function renderAll(){
  renderBanner();
  renderShifts();
  renderWarnings();
  renderNoCare();
  renderRoutine();
  renderHistoryIfOpen();
}

/* 初期化 */
document.getElementById('today').textContent=fmtHeader();
document.getElementById('histToggle').onclick=function(){
  const l=document.getElementById('histList');
  const open=l.style.display!=='none';
  l.style.display=open?'none':'block';
  this.textContent=(open?'▸':'▾')+' 記録履歴を見る';
  if(!open) renderHistory();
};
loadStateFor(todayKey);
renderAll();
</script>
